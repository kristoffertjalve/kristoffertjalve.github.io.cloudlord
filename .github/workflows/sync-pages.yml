name: Sync Cloudlord pages
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/page.html'
      - 'scripts/build_pages.py'
      - '.github/workflows/sync-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate HTML from shared content
        run: python scripts/build_pages.py
      - name: Validate generated HTML and JavaScript
        run: |
          python scripts/build_pages.py --check
          node --check estate-router.js
          node --check script.js
      - name: Commit generated pages if needed
        run: |
          if ! git diff --quiet -- '*.html'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "Sync generated pages from shared content"
            git push
          fi
