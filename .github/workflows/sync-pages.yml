name: Sync Cloudlord pages
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/page.html'
      - 'scripts/build_pages.py'
      - 'tests/**'
      - '.github/workflows/sync-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudlord-page-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate HTML from shared content
        run: python scripts/build_pages.py
      - name: Validate generated pages and Markdown content
        run: |
          python scripts/build_pages.py --check
          python -m unittest discover -s tests -v
      - name: Commit generated pages if needed
        run: |
          if ! git diff --quiet -- '*.html' sitemap.xml robots.txt || [ -n "$(git ls-files --others --exclude-standard -- sitemap.xml robots.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html' sitemap.xml robots.txt
            git commit -m "Sync generated pages from shared content"
            git push
          fi
