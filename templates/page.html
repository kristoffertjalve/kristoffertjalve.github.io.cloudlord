<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/styles.css?v=mobile-windows-ticker-20261029">

    <script defer src="/script.js?v=cursor-toggle-20261029"></script>
    <script defer src="/field-photos.js?v=20261029"></script>

    <script defer src="/estate-router.js?v=mobile-windows-20261029"></script>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL}}">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <script type="application/ld+json">{{SCHEMA}}</script>
</head>
<body{{BODY_ATTR}}>
    {{NEWS_BAR}}
    <div class="container">
        <aside class="left-panel" id="domains">
            <pre>
 _   |~  _
[_]--'--[_]
|'|""`""|'|
| | /^\ | |
|_|_|I|_|_|
            </pre>
            <p><a href="/">Cloudlord.management</a></p>
            <button type="button" id="mobile-estates-toggle" class="mobile-estates-toggle" aria-expanded="false" aria-controls="estate-navigation">Estates</button>
            <div class="mobile-about-actions" aria-label="About Cloudlord"><a href="/owner/">Owner</a><a href="/partners/">Partners</a><a href="/press/">Press</a><a href="/contact/">Contact</a></div>
            <div class="mobile-window-actions" aria-label="Open Cloudlord windows"><button type="button" class="mobile-panel-toggle" data-panel="messages" aria-expanded="false" aria-controls="messages-window">Messages</button><button type="button" class="mobile-panel-toggle" data-panel="calendar" aria-expanded="false" aria-controls="calendar-window">Calendar</button><button type="button" class="mobile-panel-toggle" data-panel="photos" aria-expanded="false" aria-controls="photos-window">Photos</button></div>
            <nav id="estate-navigation" aria-label="Estates and about">
            <button type="button" id="mobile-estates-close" class="mobile-estates-close" aria-label="Close estates">Close ×</button>
            {{NAVIGATION}}
            </nav>
            <div class="sidebar-controls"><button type="button" id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle color theme">🟢</button><button type="button" id="cursor-mode-toggle" class="cursor-mode-toggle" aria-label="Enable fruit fly cursor" aria-pressed="false"><img src="/cursors/flying.gif" alt="Fruit fly"></button></div>
            <br><br><br>
            <iframe title="Internet Phone Book dial-a-site badge" loading="lazy" src="https://internetphonebook.net/badges/dial-a-site-badge.html?number=585&size=small" width="228" height="54" frameborder="0" style="border: 1px solid #000;"></iframe>
            
        </aside>
        {{MAIN}}

        <aside class="right-panel">
            <section class="sidebar-window messages-window" id="messages-window" aria-labelledby="messages-title">
                <div class="sidebar-window-heading"><p class="sidebar-title" id="messages-title">Messages</p><a class="messages-rss" href="https://www.are.na/kristoffer-tjalve/telegrams-bhyik8dsunw/feed/rss" target="_blank" rel="noopener noreferrer" aria-label="Subscribe to Messages RSS feed" title="Messages RSS feed">RSS</a><button type="button" class="mobile-panel-close" data-panel="messages" aria-label="Close Messages">Close ×</button></div>
                <div id="message-board">
                    <!-- Messages will be dynamically loaded here -->
                </div>
            </section>
            <section class="sidebar-window calendar-window" id="calendar-window" aria-labelledby="calendar-title">
                <div class="sidebar-window-heading"><p class="sidebar-title" id="calendar-title">Calendar</p><button type="button" class="mobile-panel-close" data-panel="calendar" aria-label="Close Calendar">Close ×</button></div>
                <div id="calendar-board">{{CALENDAR}}</div>
            </section>
            <section class="sidebar-window photos-window" id="photos-window" aria-label="Field Photos">
                <button type="button" class="mobile-panel-close photos-close" data-panel="photos" aria-label="Close Photos">Close ×</button>
                <a class="field-photo-link" href="https://www.are.na/kristoffer-tjalve/field-photos" target="_blank" rel="noopener noreferrer" aria-label="View Field Photos on Are.na">
                    <span class="field-photo-caption" id="field-photo-caption">View Field Photos on Are.na</span>
                </a>
            </section>
        </aside>
    </div>
     <link href="https://melonking.net/styles/flood.css" rel="stylesheet" type="text/css" media="all" /><script defer src="https://melonking.net/scripts/flood.js"></script><script defer src="/leaky-ring.js?v=20261029b"></script>
