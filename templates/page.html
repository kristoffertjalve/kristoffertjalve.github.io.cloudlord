<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="/styles.css?v=desktop-frame-scroll-20261029">
    
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="/script.js?v=mobile-messages-20261028"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="47956f49-3450-4744-95fa-f135a8890f68"></script>
    <script defer src="/estate-router.js?v=mobile-panels-20261028"></script>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL}}">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <script type="application/ld+json">{{SCHEMA}}</script>
</head>
<body{{BODY_ATTR}}>
    <div class="container">
        <aside class="left-panel" id="domains">
            <pre>
 _   |~  _
[_]--'--[_]
|'|""`""|'|
| | /^\ | |
|_|_|I|_|_|
            </pre>
            <p><a href="/">Cloudlord.management</a></p>
            <button type="button" id="mobile-estates-toggle" class="mobile-estates-toggle" aria-expanded="false" aria-controls="estate-navigation">Explore estates +</button>
            <div class="mobile-window-actions" aria-label="Open Cloudlord windows"><button type="button" class="mobile-panel-toggle" data-panel="messages" aria-expanded="false" aria-controls="messages-window">Messages</button><button type="button" class="mobile-panel-toggle" data-panel="calendar" aria-expanded="false" aria-controls="calendar-window">Calendar</button></div>
            <nav id="estate-navigation" aria-label="Estates and about">
            <button type="button" id="mobile-estates-close" class="mobile-estates-close" aria-label="Close estates">Close ×</button>
            {{NAVIGATION}}
            </nav>
            <br><br><br>
            <iframe title="Internet Phone Book dial-a-site badge" loading="lazy" src="https://internetphonebook.net/badges/dial-a-site-badge.html?number=585&size=small" width="228" height="54" frameborder="0" style="border: 1px solid #000;"></iframe>
            <button id="dark-mode-toggle" class="dark-mode-toggle">🟢 </button>
        </aside>
        {{MAIN}}

        <aside class="right-panel">
            <section class="sidebar-window messages-window" id="messages-window" aria-labelledby="messages-title">
                <div class="sidebar-window-heading"><p class="sidebar-title" id="messages-title">Messages</p><button type="button" class="mobile-panel-close" data-panel="messages" aria-label="Close Messages">Close ×</button></div>
                <div id="message-board">
                    <!-- Messages will be dynamically loaded here -->
                </div>
            </section>
            <section class="sidebar-window calendar-window" id="calendar-window" aria-labelledby="calendar-title">
                <div class="sidebar-window-heading"><p class="sidebar-title" id="calendar-title">Calendar</p><button type="button" class="mobile-panel-close" data-panel="calendar" aria-label="Close Calendar">Close ×</button></div>
                <div id="calendar-board">{{CALENDAR}}</div>
            </section>
        </aside>
    </div>
     <link href="https://melonking.net/styles/flood.css" rel="stylesheet" type="text/css" media="all" /><script defer src="https://melonking.net/scripts/flood.js"></script>
</body>
</html>
